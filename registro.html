<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | TODIVO CL</title><meta name="description" content="Crea tu cuenta en TODIVO CL."><style>body{margin:0;font-family:Arial;background:#071b49;min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(430px,92%);padding:32px;border-radius:22px;box-sizing:border-box;color:#15213b}h1{color:#087cff}input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #d8dfeb;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#087cff;color:#fff;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#087cff}.msg{margin-top:12px;font-weight:700}</style></head><body><main class="box"><h1>Crear tu cuenta</h1><p>Compra, guarda favoritos y sigue tus pedidos en TODIVO CL.</p><form id="f"><input id="name" placeholder="Nombre completo" required><input id="email" type="email" placeholder="Correo electrónico" required><input id="phone" placeholder="Teléfono"><input id="password" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required><button>Crear cuenta</button></form><div id="m" class="msg"></div><a class="back" href="/">← Volver</a></main><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Creando cuenta...';let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,password:password.value})});let d=await r.json();if(r.ok)location.href='/';else m.textContent=d.error||'No se pudo crear la cuenta';}</script></body></html>
