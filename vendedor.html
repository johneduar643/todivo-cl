<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal vendedor | TODIVO CL</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#071b49}.top{background:#071b49;color:white;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e1e8f1;border-radius:16px;padding:18px}.stat strong{display:block;font-size:28px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea{padding:11px;border:1px solid #ccd7e6;border-radius:9px}.form textarea{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:11px 15px;background:#087cff;color:#fff;font-weight:800;cursor:pointer}.wide{grid-column:1/-1}.item{padding:11px;border-bottom:1px solid #edf1f6}.muted{color:#71829a}@media(max-width:700px){.cards,.form{grid-template-columns:1fr}}</style></head><body><header class="top"><b>TODIVO <span style="color:#00c8ff">CL</span> · Portal vendedor</b><a href="/cuenta.html" style="color:white">Mi cuenta</a></header><main class="wrap"><div id="status"></div><div class="cards" id="stats"></div><section class="card" style="margin-top:16px"><h2>Publicar producto</h2><form id="form" class="form"><input id="name" placeholder="Nombre" required><input id="category" placeholder="Categoría" required><input id="price" type="number" placeholder="Precio" required><input id="oldPrice" type="number" placeholder="Precio anterior"><input id="stock" type="number" placeholder="Stock" required><input id="tag" placeholder="Etiqueta"><input id="image" placeholder="Ruta de imagen (opcional)"><textarea id="description" placeholder="Descripción"></textarea><button class="btn wide">Publicar producto</button></form><p id="msg"></p></section><section class="card" style="margin-top:16px"><h2>Mis productos</h2><div id="products"></div></section><section class="card" style="margin-top:16px"><h2>Mis pedidos</h2><div id="orders"></div></section></main><script>async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}async function load(){try{let d=await api('/api/seller/dashboard');status.innerHTML='<p>Estado: <b>'+d.seller.status+'</b> · Tienda: <b>'+d.seller.store_name+'</b></p>';stats.innerHTML='<div class="card stat"><small>Productos</small><strong>'+d.stats.products+'</strong></div><div class="card stat"><small>Pedidos</small><strong>'+d.stats.orders+'</strong></div><div class="card stat"><small>Ventas</small><strong>$'+Number(d.stats.sales).toLocaleString('es-CL')+'</strong></div>';products.innerHTML=d.products.length?d.products.map(p=>`<div class="item"><b>${p.name}</b> · $${Number(p.price).toLocaleString('es-CL')} · stock ${p.stock}</div>`).join(''):'<p class="muted">No tienes productos publicados.</p>';orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="item"><b>${o.code}</b> · ${o.status}<br>${o.items.map(i=>i.name+' × '+i.qty).join(', ')}</div>`).join(''):'<p class="muted">No tienes pedidos todavía.</p>'}catch(e){status.innerHTML='<p style="color:#b42318">'+e.message+'</p>'}}form.onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/seller/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:category.value,price:+price.value,oldPrice:+oldPrice.value||0,stock:+stock.value,tag:tag.value,image:image.value,description:description.value})});msg.textContent='Producto publicado: '+d.id;form.reset();load()}catch(e){msg.textContent=e.message}};load()</script></body></html>
