<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar contraseña | TODIVO CL</title><style>body{margin:0;font-family:Arial;background:#071b49;min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(460px,94%);padding:30px;border-radius:22px;color:#13213e;box-sizing:border-box}.brand{font-size:30px;font-weight:900;color:#071b49}.brand span{color:#00c8ff}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #d6dfeb;border-radius:10px}button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#087cff;color:#fff;font-weight:800}.msg{margin-top:12px;font-weight:700}.links{text-align:center;margin-top:18px}.links a{color:#087cff;font-weight:700;text-decoration:none}.note{background:#f4f8fd;padding:12px;border-radius:10px;font-size:13px;line-height:1.45}</style></head><body><main class="box"><div class="brand">TODIVO <span>CL</span></div><h1>Recuperar contraseña</h1><p>Ingresa tu correo y te enviaremos instrucciones si existe una cuenta.</p><form id="f"><input id="email" type="email" placeholder="Correo electrónico" required><button>Solicitar recuperación</button></form><div id="m" class="msg"></div><div class="note">Por seguridad, TODIVO CL no revela si un correo está registrado. El envío real de correos requiere configurar un proveedor de email en producción.</div><div class="links"><a href="login.html">Volver a ingresar</a></div></main><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Procesando...';try{let r=await fetch('/api/password/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});let d=await r.json();m.textContent=d.message||'Solicitud procesada.'}catch(e){m.textContent='No se pudo procesar la solicitud.'}}</script></body></html>
