<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar | TODIVO CL</title><style>body{margin:0;font-family:Arial;background:#071b49;min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(460px,94%);padding:30px;border-radius:22px;color:#13213e}.brand{font-size:30px;font-weight:900;color:#071b49}.brand span{color:#00c8ff}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #d6dfeb;border-radius:10px}button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#087cff;color:#fff;font-weight:800}.alt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{margin-top:12px;font-weight:700}.links{text-align:center;margin-top:18px}.links a{color:#087cff;font-weight:700;text-decoration:none}</style></head><body><main class="box"><div class="brand">TODIVO <span>CL</span></div><h1>Ingresar</h1><p>Accede a tu cuenta o al panel de administración.</p><form id="f"><input id="email" type="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña" required><div class="alt"><button type="submit">Entrar como cliente</button><button type="button" id="admin">Administrador</button></div></form><div class="links"><a href="registro.html">Crear cuenta</a> · <a href="recuperar.html">¿Olvidaste tu contraseña?</a> · <a href="/">Volver a la tienda</a></div><div id="m" class="msg"></div></main><script>const m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();m.textContent='Ingresando...';let r=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(r.ok)location.href='/cuenta.html';else m.textContent=d.error||'No se pudo ingresar'};admin.onclick=async()=>{m.textContent='Ingresa la contraseña de administrador en la siguiente ventana.';const p=prompt('Contraseña de administrador');if(p===null)return;let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});let d=await r.json();if(r.ok)location.href='/panel.html';else m.textContent=d.error||'No autorizado'};</script></body></html>
