<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acceso administrador | TODIVO CL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#071B49}.card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 15px 45px rgba(7,27,73,.12);border:1px solid #e1e8f2}.logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:8px}.logo span{color:#00C8FF}.sub{text-align:center;color:#667792;margin-bottom:25px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:800;font-size:14px}.field input{padding:13px;border:1px solid #ccd7e6;border-radius:10px;font-size:16px;width:100%}.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#087CFF;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.error{display:none;margin-top:12px;padding:10px;border-radius:9px;background:#fff0f0;color:#b42318;font-size:13px}.back{text-align:center;margin-top:18px}.back a{color:#087CFF;text-decoration:none;font-weight:800}</style></head><body><div class="card"><div class="logo">TODIVO <span>CL</span></div><div class="sub">Acceso al panel de administración</div><form id="form"><div class="field"><label for="password">Contraseña de administrador</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar al panel</button><div id="error" class="error"></div></form><div class="back"><a href="/">← Volver a la tienda</a></div></div><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error');err.style.display='none';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo iniciar sesión');location.href='/panel.html';}catch(x){err.textContent=x.message;err.style.display='block';}});</script></body></html>
