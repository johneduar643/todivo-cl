<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento de pedido | TODIVO CL</title><meta name="description" content="Consulta el estado de tu pedido de TODIVO CL."><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#071B49}.top{background:#061a3a;color:#fff;padding:14px 4%}.wrap{max-width:760px;margin:45px auto;padding:0 20px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:28px;box-shadow:0 8px 25px rgba(7,27,73,.06)}h1{margin-top:0}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-weight:800;font-size:13px}.field input{padding:13px;border:1px solid #ccd7e6;border-radius:10px}.btn{border:0;border-radius:10px;background:#087CFF;color:#fff;padding:13px 18px;font-weight:900;cursor:pointer;width:100%}.result{display:none;margin-top:20px;padding:18px;background:#f5f9ff;border-radius:12px}.error{display:none;color:#b32626;background:#fff0f0;padding:12px;border-radius:10px;margin-top:12px}.status{font-weight:900;color:#087CFF}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8eef7}.back{display:inline-block;margin-bottom:18px;color:#087CFF;font-weight:800;text-decoration:none}</style></head><body><div class="top"><strong>TODIVO CL</strong></div><main class="wrap"><a class="back" href="index.html">← Volver a la tienda</a><section class="card"><h1>Seguimiento de pedido</h1><p>Ingresa el código que recibiste al finalizar tu compra y el correo usado en el pedido.</p><form id="form"><div class="field"><label>Código de pedido</label><input id="code" placeholder="TDV-20261004-ABCDE" required></div><div class="field"><label>Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com" required></div><button class="btn">Consultar pedido</button></form><div id="error" class="error"></div><div id="result" class="result"></div></section></main><script>const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('es-CL');$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').style.display='none';$('result').style.display='none';try{const r=await fetch('/api/order-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value,email:$('email').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo consultar');const o=d.order;$('result').innerHTML='<h2>Pedido '+o.code+'</h2><p>Estado: <span class="status">'+o.status+'</span></p><p>Total: <strong>'+money(o.total)+'</strong></p><p>Entrega: '+o.shipping+'</p><h3>Productos</h3>'+o.items.map(i=>'<div class="item"><span>'+i.name+'</span><strong>× '+i.qty+'</strong></div>').join('');$('result').style.display='block';}catch(err){$('error').textContent=err.message;$('error').style.display='block'}});</script></body></html>
