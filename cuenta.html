<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | TODIVO CL</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#071b49}.top{background:#071b49;color:white;padding:18px 5%}.brand{font-size:25px;font-weight:900}.brand span{color:#00c8ff}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{border:0;padding:11px 15px;border-radius:10px;background:white;font-weight:800;cursor:pointer}.nav button.active{background:#087cff;color:white}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #e0e8f2;border-radius:16px;padding:18px;box-shadow:0 6px 20px #071b4908}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field textarea{padding:11px;border:1px solid #ccd7e6;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#087cff;color:white;font-weight:800;cursor:pointer}.danger{background:#fff0f0;color:#b42318}.item{border:1px solid #e5ebf3;border-radius:11px;padding:12px;margin:8px 0}.muted{color:#71829a}.msg{font-weight:700;margin-top:10px}</style></head><body><header class="top"><div class="brand">TODIVO <span>CL</span></div><div>Mi cuenta</div></header><main class="wrap"><div class="nav"><button class="active" data-s="perfil">Perfil</button><button data-s="pedidos">Mis pedidos</button><button data-s="direcciones">Direcciones</button><button data-s="favoritos">Favoritos</button><button data-s="avisos">Notificaciones</button><button data-s="vendedor">Vende en TODIVO</button><button id="logout" class="danger">Cerrar sesión</button></div><section id="perfil" class="section active"><div class="card"><h2>Mi perfil</h2><div class="field"><label>Nombre</label><input id="name"></div><div class="field"><label>Teléfono</label><input id="phone"></div><div class="field"><label>Correo</label><input id="email" disabled></div><button class="btn" id="save">Guardar cambios</button><div id="msg" class="msg"></div></div></section><section id="pedidos" class="section"><div class="card"><h2>Mis pedidos</h2><div id="orders"></div></div></section><section id="direcciones" class="section"><div class="card"><h2>Mis direcciones</h2><div id="addresses"></div><h3>Agregar dirección</h3><div class="grid"><input id="region" placeholder="Región"><input id="commune" placeholder="Comuna"><input id="address" placeholder="Dirección"><input id="detail" placeholder="Depto / casa / referencia"><input id="label" placeholder="Etiqueta: Casa, trabajo..."></div><button class="btn" id="addAddress">Guardar dirección</button></div></section><section id="favoritos" class="section"><div class="card"><h2>Favoritos</h2><div id="favs"></div></div></section><section id="avisos" class="section"><div class="card"><h2>Notificaciones</h2><div id="notes"></div><button class="btn" id="read">Marcar como leídas</button></div></section><section id="vendedor" class="section"><div class="card"><h2>Vende en TODIVO</h2><p>Solicita tu tienda y, una vez aprobada, tendrás acceso al portal de vendedor.</p><div class="field"><input id="store" placeholder="Nombre de tu tienda"></div><div class="field"><textarea id="desc" placeholder="Qué vendes"></textarea></div><button class="btn" id="apply">Solicitar ser vendedor</button><div id="sellerMsg" class="msg"></div></div></section></main><script>const $=x=>document.getElementById(x);async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(b.dataset.s).classList.add('active');document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.s==='pedidos')loadOrders();if(b.dataset.s==='direcciones')loadAddresses();if(b.dataset.s==='favoritos')loadFavs();if(b.dataset.s==='avisos')loadNotes();if(b.dataset.s==='vendedor')loadSeller()});async function load(){try{let d=await api('/api/customer/profile');$('name').value=d.user.name;$('email').value=d.user.email;$('phone').value=d.user.phone||''}catch(e){location.href='/login.html'}}async function loadOrders(){let d=await api('/api/customer/orders');$('orders').innerHTML=d.length?d.map(o=>`<div class="item"><b>${o.code}</b><br><span class="muted">${o.status} · $${Number(o.total).toLocaleString('es-CL')}</span><div>${o.items.map(i=>`${i.name} × ${i.qty}`).join('<br>')}</div></div>`).join(''):'<p class="muted">Todavía no tienes pedidos.</p>'}async function loadAddresses(){let d=await api('/api/customer/addresses');$('addresses').innerHTML=d.length?d.map(a=>`<div class="item"><b>${a.label||'Dirección'}</b><br>${a.region}, ${a.commune}<br>${a.address} ${a.detail||''}<br><button class="btn danger" onclick="delAddr('${a.id}')">Eliminar</button></div>`).join(''):'<p class="muted">No tienes direcciones guardadas.</p>'}async function delAddr(id){await api('/api/customer/addresses/'+id,{method:'DELETE'});loadAddresses()}async function loadFavs(){let d=await api('/api/customer/favorites');$('favs').innerHTML=d.length?d.map(p=>`<div class="item"><b>${p.name}</b> · $${Number(p.price).toLocaleString('es-CL')} <button class="btn danger" onclick="delFav('${p.id}')">Quitar</button></div>`).join(''):'<p class="muted">No tienes favoritos guardados.</p>'}async function delFav(id){await api('/api/customer/favorites/'+id,{method:'DELETE'});loadFavs()}async function loadNotes(){let d=await api('/api/customer/notifications');$('notes').innerHTML=d.length?d.map(n=>`<div class="item"><b>${n.title}</b><br>${n.message}</div>`).join(''):'<p class="muted">No hay notificaciones.</p>'}async function loadSeller(){let d=await api('/api/seller/me');$('sellerMsg').textContent=d.seller?`Estado de tu solicitud: ${d.seller.status}. Tienda: ${d.seller.store_name}`:''}save.onclick=async()=>{try{await api('/api/customer/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,phone:phone.value})});msg.textContent='Guardado correctamente.'}catch(e){msg.textContent=e.message}};addAddress.onclick=async()=>{try{await api('/api/customer/addresses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region:region.value,commune:commune.value,address:address.value,detail:detail.value,label:label.value})});loadAddresses()}catch(e){alert(e.message)}};apply.onclick=async()=>{try{let d=await api('/api/seller/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeName:store.value,description:desc.value})});sellerMsg.textContent='Solicitud enviada. Estado: '+d.status}catch(e){sellerMsg.textContent=e.message}};read.onclick=async()=>{await api('/api/customer/notifications/read',{method:'POST'});loadNotes()};logout.onclick=async()=>{await api('/api/customer/logout',{method:'POST'});location.href='/'};load();</script></body></html>
